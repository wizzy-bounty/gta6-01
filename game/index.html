<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON TIDE — Porto Sirena</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0e1a;
    font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif; color:#eaf6ff;
    -webkit-user-select:none; user-select:none; }
  #game-canvas { position:fixed; inset:0; display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .panel { background:rgba(8,14,28,.72); border:1px solid rgba(64,224,255,.45);
    border-radius:8px; box-shadow:0 0 14px rgba(0,180,255,.25), inset 0 0 18px rgba(0,60,90,.35);
    padding:7px 10px; backdrop-filter: blur(2px); }
  /* top-left : cash / respect / district */
  #hud-topleft { position:absolute; top:12px; left:12px; min-width:218px; }
  #hud-cash { font-size:26px; font-weight:800; letter-spacing:.5px; color:#7dffb0;
    text-shadow:0 0 8px rgba(60,255,140,.55); line-height:1; }
  #hud-cash.bump { animation: cashbump .45s ease; }
  @keyframes cashbump { 30% { transform:scale(1.13); color:#d8ffe6; } }
  #hud-rank { margin-top:5px; font-size:13px; font-weight:700; color:#ffd76a;
    text-transform:uppercase; letter-spacing:1px; }
  #hud-respectbar { height:7px; margin-top:3px; background:rgba(255,255,255,.14);
    border-radius:4px; overflow:hidden; }
  #hud-respectfill { height:100%; width:40%; background:linear-gradient(90deg,#ff9d2e,#ffd76a);
    border-radius:4px; }
  #hud-district { margin-top:6px; font-size:13px; font-weight:700; color:#6ee7ff; letter-spacing:.6px; }
  #hud-standing { font-size:12px; color:#ffb3e2; letter-spacing:2px; }
  /* top-center : mission banner */
  #hud-topcenter { position:absolute; top:12px; left:50%; transform:translateX(-50%);
    width:430px; text-align:center; }
  #hud-mission-title { font-size:15px; font-weight:800; letter-spacing:1.6px; color:#ff5fd2;
    text-transform:uppercase; text-shadow:0 0 9px rgba(255,60,200,.6); }
  #hud-objective { margin-top:2px; font-size:14px; font-weight:600; color:#eaf6ff; }
  #hud-objective b { color:#6ee7ff; }
  /* top-right : wanted / clock */
  #hud-topright { position:absolute; top:12px; right:12px; text-align:right; min-width:170px; }
  #hud-stars { font-size:27px; line-height:1; letter-spacing:3px; color:#2c3e55; }
  #hud-stars .on { color:#ffd76a; text-shadow:0 0 10px rgba(255,190,40,.85); }
  #hud-stars.flash .on { animation: starflash .5s steps(2) infinite; }
  @keyframes starflash { 50% { color:#ff4747; text-shadow:0 0 12px rgba(255,40,40,.95); } }
  #hud-heatbar { height:7px; margin-top:5px; background:rgba(255,255,255,.14); border-radius:4px; overflow:hidden; }
  #hud-heatfill { height:100%; width:0%; background:linear-gradient(90deg,#ffb02e,#ff4747); }
  #hud-clockrow { margin-top:5px; font-size:14px; font-weight:700; color:#eaf6ff; }
  #hud-weather { color:#6ee7ff; font-weight:800; letter-spacing:1px; }
  /* bottom-left : minimap + vitals */
  #hud-minimap-wrap { position:absolute; left:12px; bottom:12px; text-align:center; }
  #hud-minimap { width:196px; height:196px; border-radius:10px; display:block; }
  #hud-maplabel { margin-top:4px; font-size:12px; font-weight:800; letter-spacing:1.4px; color:#6ee7ff;
    text-transform:uppercase; text-shadow:0 1px 4px #000; }
  #hud-vitals { position:absolute; left:222px; bottom:12px; width:212px; }
  .vital-row { display:flex; align-items:center; gap:6px; margin-top:4px; }
  .vital-tag { font-size:11px; font-weight:800; width:34px; color:#ffb3e2; letter-spacing:.5px; }
  .vital-bar { flex:1; height:11px; background:rgba(255,255,255,.13); border-radius:5px; overflow:hidden;
    border:1px solid rgba(255,255,255,.18); }
  .vital-fill { height:100%; }
  #hud-healthfill { background:linear-gradient(90deg,#ff3860,#ff7d5a); width:100%; }
  #hud-armorfill { background:linear-gradient(90deg,#3fa9ff,#6ee7ff); width:60%; }
  /* bottom-right : context panel */
  #hud-context { position:absolute; right:12px; bottom:12px; width:228px; text-align:right; }
  #hud-speed { font-size:44px; font-weight:800; line-height:.95; color:#fff;
    text-shadow:0 0 12px rgba(64,224,255,.65); }
  #hud-speed small { font-size:14px; color:#6ee7ff; font-weight:700; }
  .ctx-label { font-size:11px; font-weight:800; letter-spacing:1.2px; color:#ffb3e2; text-transform:uppercase; }
  .ctx-value { font-size:16px; font-weight:700; color:#eaf6ff; }
  .gauge { height:8px; background:rgba(255,255,255,.13); border-radius:4px; overflow:hidden; margin:3px 0 6px; }
  .gauge > div { height:100%; }
  #hud-nitrofill { background:linear-gradient(90deg,#3fa9ff,#a06bff); width:50%; }
  #hud-vehhealthfill { background:linear-gradient(90deg,#7dffb0,#d8ff6a); width:80%; }
  #hud-ammo { font-size:30px; font-weight:800; color:#fff; }
  #hud-ammo small { font-size:14px; color:#9fb6cc; }
  /* bottom-center : prompt + subtitles */
  #hud-bottomcenter { position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    width:520px; text-align:center; }
  #hud-prompt { display:inline-block; font-size:16px; font-weight:800; letter-spacing:.6px;
    color:#0b0e1a; background:linear-gradient(90deg,#ffd76a,#ffb02e); border-radius:6px;
    padding:5px 14px; box-shadow:0 0 16px rgba(255,180,40,.55); }
  #hud-prompt:empty { display:none; }
  #hud-subtitle { margin-top:8px; font-size:15px; line-height:1.35; color:#fff;
    text-shadow:0 1px 3px #000, 0 0 8px rgba(0,0,0,.8); }
  #hud-subtitle .speaker { color:#ff5fd2; font-weight:800; text-transform:uppercase; letter-spacing:.6px; }
  /* race overlay */
  #hud-race { position:absolute; top:86px; right:12px; width:196px; text-align:right; display:none; }
  #hud-race .big { font-size:30px; font-weight:800; color:#ffd76a; }
  /* garage panel */
  #hud-garage { position:absolute; top:50%; right:26px; transform:translateY(-50%);
    width:300px; display:none; pointer-events:none; }
  #hud-garage h3 { margin:0 0 6px; font-size:17px; letter-spacing:1.2px; color:#6ee7ff; }
  .garage-row { display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;
    border-bottom:1px dashed rgba(255,255,255,.15); }
  .garage-row .price { color:#7dffb0; font-weight:700; }
  /* weapon wheel */
  #hud-wheel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:280px; height:280px; display:none; }
  /* toast */
  #hud-toast { position:absolute; top:120px; left:50%; transform:translateX(-50%);
    text-align:center; opacity:0; transition:opacity .3s; }
  #hud-toast .amt { font-size:34px; font-weight:800; color:#7dffb0; text-shadow:0 0 14px rgba(60,255,140,.7); }
  #hud-toast .sub { font-size:15px; font-weight:700; color:#ffd76a; letter-spacing:1px; }
  /* damage vignette + direction */
  #hud-vignette { position:fixed; inset:0; pointer-events:none; z-index:6; opacity:0;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(255,20,40,.55) 100%); }
  #hud-dmgdir { position:fixed; left:50%; top:50%; width:120px; height:120px; margin:-60px 0 0 -60px;
    pointer-events:none; z-index:6; opacity:0; }
  #hud-dmgdir div { position:absolute; left:50%; top:-6px; width:44px; height:14px; margin-left:-22px;
    background:radial-gradient(ellipse at center, rgba(255,40,60,.95), transparent 70%); border-radius:50%; }
  /* splash screens */
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at 50% 65%, rgba(16,30,58,.88), rgba(4,6,14,.96)); }
  .screen h1 { font-size:64px; margin:0; letter-spacing:6px; font-weight:900;
    background:linear-gradient(90deg,#6ee7ff,#ff5fd2); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 34px rgba(255,60,200,.25); }
  .screen h2 { margin:6px 0 0; font-size:19px; letter-spacing:3px; color:#ffd76a; font-weight:700; }
  .screen p { max-width:560px; font-size:14.5px; line-height:1.55; color:#c9dcee; }
  .screen .keys { font-size:13px; color:#9fb6cc; line-height:1.9; }
  .screen .keys b { color:#6ee7ff; }
  .btn { pointer-events:auto; cursor:pointer; margin-top:16px; font-size:18px; font-weight:800;
    letter-spacing:1.5px; color:#0b0e1a; background:linear-gradient(90deg,#6ee7ff,#3fa9ff);
    border:none; border-radius:8px; padding:11px 34px; box-shadow:0 0 20px rgba(64,224,255,.5); }
  #screen-fail h1 { background:linear-gradient(90deg,#ff4747,#ff9d2e); -webkit-background-clip:text; background-clip:text; }
  .hidden { display:none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<div id="hud-vignette"></div>
<div id="hud-dmgdir"><div></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
