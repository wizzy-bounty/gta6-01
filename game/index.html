<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARISOL BAY — an original open-world crime story</title>
<style>
  html, body { margin:0; padding:0; background:#1b1030; height:100%; overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 20%, #3a1c5e 0%, #170b2c 70%); }
  canvas { width:min(100vw, 177.78vh); height:min(56.25vw, 100vh); display:block;
    box-shadow:0 18px 60px rgba(0,0,0,.55); background:#000; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1024" height="576"></canvas></div>
<script>
'use strict';
/* =====================================================================
   MARISOL BAY — an original open-world crime game.
   One self-contained file: a painter-style 2D canvas renderer with
   layered parallax, gradient skies and shape-drawn vehicles and people.
   Playable with keyboard and mouse; deterministic seeded scenes are
   available through ?shot=<name>&seed=<n> for screenshot capture.
   ===================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1024, H = 576;
const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot') || '';
const SEED = parseInt(Q.get('seed') || '7', 10) || 7;

/* ---------- deterministic random ---------- */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = mulberry(SEED * 1000 + 17);
const rr = (a, b) => a + R() * (b - a);
const pick = arr => arr[Math.floor(R() * arr.length)];

/* ---------- small drawing helpers ---------- */
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath(); ctx.fill();
}
function poly(pts, c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2, c, w) {
  ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function txt(s, x, y, size, c, align, bold, font) {
  ctx.fillStyle = c; ctx.font = (bold ? 'bold ' : '') + size + 'px ' + (font || '"Trebuchet MS","Segoe UI",Verdana,sans-serif');
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function vgrad(x, y, w, h, stops) {
  const g = ctx.createLinearGradient(x, y, x, y + h);
  for (const [o, c] of stops) g.addColorStop(o, c);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
}
function panel(x, y, w, h, alpha) {
  rrect(x, y, w, h, 9, 'rgba(10,14,30,' + (alpha == null ? 0.78 : alpha) + ')');
  ctx.strokeStyle = 'rgba(140,220,255,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function star(x, y, r, filled) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  if (filled) { ctx.fillStyle = '#ffd94d'; ctx.fill(); }
  ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = 1.4; ctx.stroke();
}

/* ---------- vehicles (rear three-quarter painter style) ---------- */
function drawCar(x, y, w, body, opts) {
  opts = opts || {};
  const h = w * 0.46, top = y - h;
  // shadow + tyres
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y + 4, w * 0.54, h * 0.16, 0, 0, 7); ctx.fill();
  rect(x - w * 0.46, y - h * 0.30, w * 0.13, h * 0.30, '#14161c');
  rect(x + w * 0.33, y - h * 0.30, w * 0.13, h * 0.30, '#14161c');
  // main body
  const g = ctx.createLinearGradient(x, top, x, y);
  g.addColorStop(0, opts.roof || body); g.addColorStop(0.45, body); g.addColorStop(1, shade(body, -28));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.5, y);
  ctx.lineTo(x - w * 0.48, top + h * 0.38);
  ctx.lineTo(x - w * 0.30, top + h * 0.10);
  ctx.lineTo(x + w * 0.30, top + h * 0.10);
  ctx.lineTo(x + w * 0.48, top + h * 0.38);
  ctx.lineTo(x + w * 0.5, y);
  ctx.closePath(); ctx.fill();
  // cabin glass
  poly([[x - w * 0.27, top + h * 0.36], [x - w * 0.17, top + h * 0.15],
        [x + w * 0.17, top + h * 0.15], [x + w * 0.27, top + h * 0.36]], 'rgba(18,32,52,0.92)');
  line(x, top + h * 0.15, x, top + h * 0.36, 'rgba(0,0,0,0.35)', 2);
  // rear window band + spoiler for the hero car
  if (opts.spoiler) {
    rect(x - w * 0.44, top + h * 0.30, w * 0.88, h * 0.07, '#101018');
    rect(x - w * 0.30, top + h * 0.37, w * 0.05, h * 0.12, '#101018');
    rect(x + w * 0.25, top + h * 0.37, w * 0.05, h * 0.12, '#101018');
  }
  // tail lights
  const tl = opts.police ? '#ff5a4d' : '#ff3b30';
  rrect(x - w * 0.44, y - h * 0.30, w * 0.20, h * 0.10, 3, tl);
  rrect(x + w * 0.24, y - h * 0.30, w * 0.20, h * 0.10, 3, opts.police ? '#5ab0ff' : tl);
  // plate + exhausts
  rrect(x - w * 0.11, y - h * 0.24, w * 0.22, h * 0.13, 2, '#e8ecf2');
  txt(opts.plate || 'MB·GT 7', x, y - h * 0.135, Math.max(7, w * 0.055), '#26324a', 'center', true);
  circle(x - w * 0.30, y - h * 0.05, w * 0.028, '#3c4350');
  circle(x + w * 0.30, y - h * 0.05, w * 0.028, '#3c4350');
  if (opts.police) {
    rect(x - w * 0.5, top + h * 0.52, w, h * 0.16, '#f2f5f9');
    txt('MBPD', x, top + h * 0.645, Math.max(8, w * 0.085), '#173a6e', 'center', true);
    // light bar
    const ly = top + h * 0.02;
    rrect(x - w * 0.30, ly, w * 0.28, h * 0.09, 3, '#ff4040');
    rrect(x + w * 0.02, ly, w * 0.28, h * 0.09, 3, '#3f8cff');
    if (opts.flash) {
      ctx.fillStyle = 'rgba(255,70,60,0.20)';
      ctx.beginPath(); ctx.ellipse(x - w * 0.16, ly, w * 0.34, h * 0.20, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(70,140,255,0.20)';
      ctx.beginPath(); ctx.ellipse(x + w * 0.16, ly, w * 0.34, h * 0.20, 0, 0, 7); ctx.fill();
    }
  }
  if (opts.label) txt(opts.label, x, top - 8, Math.max(9, w * 0.07), '#fff', 'center', true);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------- people ---------- */
function drawPerson(x, y, s, shirt, pants, skin, pose) {
  // s = height in px, (x,y) = feet centre
  const hip = y - s * 0.48, sh = y - s * 0.82;
  ctx.strokeStyle = pants; ctx.lineWidth = s * 0.11; ctx.lineCap = 'round';
  ctx.beginPath();
  if (pose === 'run') {
    ctx.moveTo(x, hip); ctx.lineTo(x - s * 0.16, y - s * 0.22); ctx.lineTo(x - s * 0.05, y);
    ctx.moveTo(x, hip); ctx.lineTo(x + s * 0.18, y - s * 0.26); ctx.lineTo(x + s * 0.30, y - s * 0.02);
  } else if (pose === 'down') {
    // handled by drawDownGuard; simple prone shape
    ctx.moveTo(x - s * 0.4, y); ctx.lineTo(x + s * 0.4, y);
  } else {
    ctx.moveTo(x, hip); ctx.lineTo(x - s * 0.10, y);
    ctx.moveTo(x, hip); ctx.lineTo(x + s * 0.10, y);
  }
  ctx.stroke();
  ctx.strokeStyle = shirt; ctx.lineWidth = s * 0.13;
  ctx.beginPath(); ctx.moveTo(x, hip); ctx.lineTo(x, sh); ctx.stroke();
  ctx.beginPath();
  if (pose === 'react') {
    ctx.moveTo(x, sh + s * 0.06); ctx.lineTo(x - s * 0.26, sh - s * 0.14);
    ctx.moveTo(x, sh + s * 0.06); ctx.lineTo(x + s * 0.24, sh - s * 0.20);
  } else if (pose === 'run') {
    ctx.moveTo(x, sh + s * 0.06); ctx.lineTo(x - s * 0.22, sh + s * 0.22);
    ctx.moveTo(x, sh + s * 0.06); ctx.lineTo(x + s * 0.24, sh + s * 0.10);
  } else {
    ctx.moveTo(x, sh + s * 0.06); ctx.lineTo(x - s * 0.18, sh + s * 0.26);
    ctx.moveTo(x, sh + s * 0.06); ctx.lineTo(x + s * 0.18, sh + s * 0.26);
  }
  ctx.stroke(); ctx.lineCap = 'butt';
  circle(x, sh - s * 0.10, s * 0.105, skin);
}
function drawDownGuard(x, y, s) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 3, s * 0.62, s * 0.10, 0, 0, 7); ctx.fill();
  rrect(x - s * 0.55, y - s * 0.13, s * 0.62, s * 0.15, s * 0.07, '#2c4a73'); // legs/trousers
  rrect(x + s * 0.02, y - s * 0.16, s * 0.42, s * 0.18, s * 0.08, '#e8b13a'); // hi-vis vest torso
  circle(x + s * 0.55, y - s * 0.08, s * 0.11, '#c98d64'); // head
  rrect(x + s * 0.44, y - s * 0.22, s * 0.22, s * 0.07, 3, '#20344f'); // cap beside head
  txt('z z', x + s * 0.62, y - s * 0.30, s * 0.16, '#cfe6ff', 'left', true);
}

/* ---------- scenery pieces ---------- */
function drawPalm(x, baseY, s, lean) {
  ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = s * 0.07; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, baseY);
  ctx.quadraticCurveTo(x + lean * s * 0.2, baseY - s * 0.6, x + lean * s * 0.42, baseY - s);
  ctx.stroke(); ctx.lineCap = 'butt';
  const txp = x + lean * s * 0.42, typ = baseY - s;
  ctx.strokeStyle = '#2e9e5b'; ctx.lineWidth = s * 0.045;
  for (let i = 0; i < 7; i++) {
    const a = Math.PI * (0.08 + i * 0.14);
    ctx.beginPath(); ctx.moveTo(txp, typ);
    ctx.quadraticCurveTo(txp + Math.cos(a) * s * 0.34, typ - Math.sin(a) * s * 0.30 + s * 0.10,
                         txp + Math.cos(a) * s * 0.52, typ - Math.sin(a) * s * 0.34 + s * 0.30);
    ctx.stroke();
  }
  circle(txp - 4, typ + 4, s * 0.045, '#7a5230'); circle(txp + 5, typ + 5, s * 0.04, '#7a5230');
}
function drawTower(x, yBase, w, h, base, litRatio, sign) {
  const g = ctx.createLinearGradient(x, yBase - h, x, yBase);
  g.addColorStop(0, shade(base, 26)); g.addColorStop(1, shade(base, -18));
  ctx.fillStyle = g; ctx.fillRect(x, yBase - h, w, h);
  const cols = Math.max(3, Math.floor(w / 13)), rows = Math.max(6, Math.floor(h / 17));
  for (let cx = 0; cx < cols; cx++) for (let ry = 0; ry < rows; ry++) {
    const lit = R() < litRatio;
    ctx.fillStyle = lit ? 'rgba(255,214,130,0.95)' : 'rgba(30,44,74,0.85)';
    ctx.fillRect(x + 5 + cx * (w - 8) / cols, yBase - h + 7 + ry * (h - 12) / rows,
                 (w - 10) / cols - 3, (h - 14) / rows - 4);
  }
  if (sign) {
    rrect(x + 3, yBase - h - 20, w - 6, 17, 4, 'rgba(8,10,24,0.85)');
    txt(sign, x + w / 2, yBase - h - 7, 10, '#7df0ff', 'center', true);
  }
}
function drawHeli(x, y, s, spotTo) {
  // spotlight cone first (behind body)
  if (spotTo) {
    const g = ctx.createLinearGradient(x, y, spotTo[0], spotTo[1]);
    g.addColorStop(0, 'rgba(255,246,190,0.55)'); g.addColorStop(1, 'rgba(255,246,190,0.10)');
    ctx.fillStyle = g;
    poly([[x - s * 0.05, y + s * 0.16], [x + s * 0.10, y + s * 0.16],
          [spotTo[0] + s * 0.85, spotTo[1]], [spotTo[0] - s * 0.85, spotTo[1]]], g);
    ctx.strokeStyle = 'rgba(255,248,205,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.05, y + s * 0.16); ctx.lineTo(spotTo[0] - s * 0.85, spotTo[1]);
    ctx.moveTo(x + s * 0.10, y + s * 0.16); ctx.lineTo(spotTo[0] + s * 0.85, spotTo[1]);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,205,0.45)';
    ctx.beginPath(); ctx.ellipse(spotTo[0], spotTo[1], s * 0.85, s * 0.20, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(x, y + s * 1.5, s * 0.7, s * 0.1, 0, 0, 7); ctx.fill();
  // tail + boom
  poly([[x + s * 0.28, y - s * 0.02], [x + s * 1.05, y - s * 0.16], [x + s * 1.05, y + s * 0.02], [x + s * 0.28, y + s * 0.10]], '#22304a');
  rect(x + s * 1.0, y - s * 0.34, s * 0.09, s * 0.42, '#22304a');
  rect(x + s * 0.97, y - s * 0.36, s * 0.15, s * 0.07, '#ff5040');
  // body
  const g2 = ctx.createLinearGradient(x, y - s * 0.3, x, y + s * 0.3);
  g2.addColorStop(0, '#31456b'); g2.addColorStop(1, '#16233c');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.ellipse(x, y, s * 0.46, s * 0.27, 0, 0, 7); ctx.fill();
  poly([[x - s * 0.40, y - s * 0.14], [x - s * 0.16, y - s * 0.19], [x - s * 0.12, y + s * 0.03], [x - s * 0.36, y + s * 0.06]], 'rgba(140,220,255,0.85)');
  txt('MBPD AIR-1', x + s * 0.16, y + s * 0.05, s * 0.13, '#eaf6ff', 'center', true);
  // skids + rotor
  line(x - s * 0.3, y + s * 0.38, x + s * 0.3, y + s * 0.38, '#0e1626', s * 0.045);
  line(x - s * 0.18, y + s * 0.24, x - s * 0.22, y + s * 0.38, '#0e1626', s * 0.04);
  line(x + s * 0.18, y + s * 0.24, x + s * 0.22, y + s * 0.38, '#0e1626', s * 0.04);
  line(x - s * 0.85, y - s * 0.36, x + s * 0.85, y - s * 0.36, 'rgba(20,26,40,0.85)', s * 0.05);
  rect(x - s * 0.03, y - s * 0.36, s * 0.06, s * 0.10, '#0e1626');
  circle(x - s * 0.30, y + s * 0.02, s * 0.045, '#ff4040');
  circle(x + s * 0.34, y + s * 0.02, s * 0.045, '#54ff9a');
}
/* ---------- HUD components ---------- */
const CREW = [
  { name: 'VERA', role: 'Wheel', col: '#ff7a59', status: 'Driving — hands steady' },
  { name: 'MAKO', role: 'Muscle', col: '#54c8ff', status: 'Rear guard, watching mirrors' },
  { name: 'GUS', role: 'Fixer', col: '#ffd94d', status: 'Scanner up, routes open' },
  { name: 'IVY', role: 'Lookout', col: '#8dff9a', status: 'Calling traffic + roadblocks' },
];
function crewStack(x, y, statuses) {
  panel(x, y, 218, 26 + CREW.length * 30, 0.72);
  txt('CREW', x + 10, y + 18, 11, '#7df0ff', 'left', true);
  CREW.forEach((c, i) => {
    const cy = y + 32 + i * 30;
    circle(x + 20, cy + 4, 10, c.col);
    txt(c.name[0], x + 20, cy + 8, 11, '#10131f', 'center', true);
    txt(c.name + ' · ' + c.role, x + 36, cy, 11, '#fff', 'left', true);
    txt(statuses && statuses[i] ? statuses[i] : c.status, x + 36, cy + 13, 9.5, '#bcd6f5');
  });
}
function missionCard(x, y, job, stage, objective, next) {
  panel(x, y, 252, 96, 0.80);
  rect(x, y, 5, 96, '#ffb03a');
  txt('MISSION', x + 14, y + 17, 10, '#ffb03a', 'left', true);
  txt(stage, x + 238, y + 17, 10, '#7df0ff', 'right', true);
  txt(job, x + 14, y + 38, 16, '#fff', 'left', true);
  txt(objective, x + 14, y + 58, 11.5, '#dceaff');
  txt('NEXT: ' + next, x + 14, y + 78, 11, '#8dff9a', 'left', true);
}
function dispatch(x, y, title, units) {
  panel(x, y, 262, 30 + units.length * 19, 0.82);
  txt(title, x + 10, y + 19, 11, '#ff9a8a', 'left', true);
  units.forEach((u, i) => {
    const uy = y + 40 + i * 19;
    circle(x + 13, uy - 4, 3.5, '#ff5040');
    txt(u[0], x + 22, uy, 9.5, '#fff', 'left', true);
    txt(u[1], x + 148, uy, 9.5, '#ffd94d', 'left', true);
    txt(u[2], x + 254, uy, 10, '#bcd6f5', 'right', true);
  });
}
function topBar(cash, clock, stars, stateText) {
  panel(330, 10, 364, 44, 0.72);
  txt('$ ' + cash, 348, 39, 19, '#8dff9a', 'left', true);
  txt(clock, 500, 30, 15, '#fff', 'center', true);
  txt(stateText, 500, 47, 9, '#ffd94d', 'center', true);
  for (let i = 0; i < 5; i++) star(588 + i * 24, 32, 9.5, i < stars);
}
function weaponChips(x, y, items) {
  items.forEach((w, i) => {
    const wx = x + i * 92;
    panel(wx, y, 84, 40, 0.72);
    txt(w[0], wx + 8, y + 17, 10.5, '#fff', 'left', true);
    txt(w[1], wx + 8, y + 33, 10, '#7df0ff');
  });
}
function vehicleCard(x, y, name, cond, speed) {
  panel(x, y, 208, 62, 0.78);
  txt(name, x + 10, y + 19, 13, '#fff', 'left', true);
  txt(speed + ' km/h', x + 198, y + 19, 13, '#ffb03a', 'right', true);
  rect(x + 10, y + 28, 188, 9, '#2a3350');
  rect(x + 10, y + 28, 188 * cond / 100, 9, cond > 50 ? '#54e08a' : '#ff5040');
  txt('CONDITION ' + cond + '%', x + 10, y + 52, 9.5, '#bcd6f5');
  txt('NOS READY', x + 198, y + 52, 9.5, '#7df0ff', 'right', true);
}
function dialogue(x, y, who, col, line1, line2) {
  panel(x, y, 330, 52, 0.82);
  circle(x + 18, y + 26, 12, col);
  txt(who[0], x + 18, y + 30, 12, '#10131f', 'center', true);
  txt(who, x + 38, y + 21, 11, col, 'left', true);
  txt(line1, x + 38, y + 36, 11.5, '#fff');
  if (line2) txt(line2, x + 38, y + 49, 11.5, '#dceaff');
}
function radioLine(x, y, s) {
  panel(x, y, 300, 24, 0.6);
  txt('♪ ' + s, x + 10, y + 16, 10.5, '#f2b8ff');
}
function minimap(cx, cy, r, routePts, blips, label) {
  circle(cx, cy, r + 5, 'rgba(10,14,30,0.78)');
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  circle(cx, cy, r, '#1d3a5f');
  // land + beach + roads
  poly([[cx - r, cy - r * 0.2], [cx + r, cy - r * 0.45], [cx + r, cy + r], [cx - r, cy + r]], '#2e6b4f');
  poly([[cx - r, cy - r * 0.2], [cx + r, cy - r * 0.45], [cx + r, cy - r * 0.1], [cx - r, cy + r * 0.25]], '#e8cf92');
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - r * 0.8, cy + r * 0.55); ctx.lineTo(cx + r * 0.8, cy - r * 0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - r * 0.2, cy + r * 0.9); ctx.lineTo(cx + r * 0.1, cy - r * 0.7); ctx.stroke();
  if (routePts && routePts.length > 1) {
    ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = 3.5; ctx.beginPath();
    routePts.forEach((p, i) => { const px = cx + p[0] * r, py = cy + p[1] * r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke();
    const last = routePts[routePts.length - 1];
    circle(cx + last[0] * r, cy + last[1] * r, 5, '#ffd94d');
  }
  (blips || []).forEach(b => circle(cx + b[0] * r, cy + b[1] * r, b[2] || 4, b[3] || '#ff5040'));
  // player arrow
  poly([[cx, cy - 8], [cx + 6, cy + 6], [cx, cy + 2], [cx - 6, cy + 6]], '#fff');
  ctx.restore();
  circle(cx, cy, r, 'rgba(0,0,0,0)');
  ctx.strokeStyle = 'rgba(140,220,255,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  if (label) txt(label, cx, cy + r + 16, 10, '#bcd6f5', 'center', true);
}

/* ---------- shared boulevard backdrop ---------- */
function boulevardSky(kind) {
  if (kind === 'golden') vgrad(0, 0, W, 300, [[0, '#3d2a6e'], [0.35, '#c7507e'], [0.7, '#ff9a56'], [1, '#ffc46b']]);
  else if (kind === 'dusk') vgrad(0, 0, W, 300, [[0, '#2c1e5e'], [0.45, '#6e3a8e'], [0.78, '#c65b8f'], [1, '#ff9e6e']]);
  else vgrad(0, 0, W, 300, [[0, '#274b8f'], [0.6, '#5f9fd8'], [1, '#a8dcff']]);
  circle(kind === 'golden' ? 770 : 830, kind === 'golden' ? 128 : 92, kind === 'golden' ? 34 : 24, 'rgba(255,236,170,0.95)');
  ctx.fillStyle = 'rgba(255,244,200,0.25)';
  ctx.beginPath(); ctx.arc(kind === 'golden' ? 770 : 830, kind === 'golden' ? 128 : 92, 58, 0, 7); ctx.fill();
}
function roadPerspective(horizon, nearL, nearR, farL, farR, col) {
  poly([[farL, horizon], [farR, horizon], [nearR, H], [nearL, H]], col || '#3a3f4d');
  // edge lines + dashes converging to the vanishing point
  const vx = (farL + farR) / 2;
  line(farL, horizon, nearL, H, '#f5f7fa', 4); line(farR, horizon, nearR, H, '#f5f7fa', 4);
  for (let i = 0; i < 7; i++) {
    const t0 = Math.pow(i / 7, 1.7), t1 = Math.pow((i + 0.45) / 7, 1.7);
    for (const f of [-0.33, 0.33]) {
      line(vx + (nearL + (nearR - nearL) * (0.5 + f / 2) - vx) * t0, horizon + (H - horizon) * t0,
           vx + (nearL + (nearR - nearL) * (0.5 + f / 2) - vx) * t1, horizon + (H - horizon) * t1, '#ffd94d', 2 + t0 * 5);
    }
  }
}

function stringLights(x1, y1, x2, y2, n) {
  ctx.strokeStyle = 'rgba(40,26,16,0.8)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + 26, x2, y2); ctx.stroke();
  const cols = ['#ffd94d', '#ff7a59', '#7df0ff', '#8dff9a', '#f2b8ff'];
  for (let i = 1; i < n; i++) {
    const t = i / n, ix = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * ((x1 + x2) / 2) + t * t * x2;
    const iy = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * (Math.max(y1, y2) + 26) + t * t * y2;
    circle(ix, iy + 3, 3.4, cols[i % cols.length]);
  }
}

  txt('SLOT 1 — Pearl Heist, Stage 3/4 · $48,250 · 62%', sx + 14, 524, 11, '#fff');
  txt('SLOT 2 — Harborfront free roam · $12,900 · 24%', sx + 14, 542, 11, '#bcd6f5');
  txt('SLOT 3 — Empty', sx + 14, 558, 11, '#5f7296');
}

/* =====================================================================
   SCENE 4 — TITLE SCREEN
   ===================================================================== */
function sceneTitle() {

  boulevardSky('golden');
  const horizon = 250;

  txt('Story 62% · Cash $48,250 · Rank: Bay Runner', 76, 270, 12, '#8dff9a');
  txt('Last saved 18:41 — Slot 1', 76, 290, 11, '#bcd6f5');
  panel(56, 316, 330, 46, 0.95);

  // save-slot cards
  const slots = [['SLOT 1', 'Pearl Heist · 62%', '$48,250'], ['SLOT 2', 'Free roam · 24%', '$12,900'], ['SLOT 3', 'Empty', '—']];
  slots.forEach((s, i) => {

/* =====================================================================
   PLAYABLE GAME — free-roam Marisol Bay
   Drive with WASD/arrows, F toggles on-foot, E steals/enters the parked
   cabriolet on foot, M opens the map, Esc pauses. Wanted stars rise with
   speed and near misses; reach the Pier 9 marker to finish the getaway.
   ===================================================================== */
const G = {
  mode: 'title', // title | drive | foot | map | done
  px: 512, speed: 0, dist: 0, cash: 48250, stars: 2, cond: 92,
  fx: 500, fy: 430, t: 0, msg: '', msgT: 0, stage: 3, won: 0,
  traffic: [], police: [], keys: {},
};
for (let i = 0; i < 5; i++) G.traffic.push({ x: 340 + i * 90, y: 300 + i * 46, v: 26 + i * 7, c: ['#e0a83c', '#7a4fd0', '#3fa7a0', '#e8ecf2', '#54c8ff'][i] });
for (let i = 0; i < 3; i++) G.police.push({ x: 300 + i * 190, y: 500, sway: i * 2.1 });
addEventListener('keydown', e => {
  G.keys[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if (G.mode === 'title' && (k === 'enter' || k === ' ')) G.mode = 'drive';
  else if (k === 'm' && (G.mode === 'drive' || G.mode === 'foot')) G.mode = 'map';
  else if ((k === 'm' || k === 'escape') && G.mode === 'map') G.mode = G.fx != null && G.onFoot ? 'foot' : 'drive';
  else if (k === 'f' && G.mode === 'drive') { G.mode = 'foot'; G.onFoot = true; G.fx = G.px; G.fy = 470; }
  else if (k === 'f' && G.mode === 'foot') { G.mode = 'drive'; G.onFoot = false; }
  else if (k === 'e' && G.mode === 'foot') {
    G.cash += 2500; G.won++; G.stars = Math.min(5, G.stars + 1);
    G.msg = 'Azure Cabriolet stolen! +$2,500 — now RUN.'; G.msgT = 200;
    G.mode = 'drive'; G.onFoot = false;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { G.keys[e.key.toLowerCase()] = false; });
cv.addEventListener('click', () => { if (G.mode === 'title') G.mode = 'drive'; if (G.mode === 'done') { G.mode = 'drive'; G.dist = 0; G.stage = 3; } });

function playFrame(dt) {
  G.t += dt;
  const k = G.keys;
  if (G.mode === 'map') { sceneMap(); return; }
  if (G.mode === 'title') { sceneTitle(); txt('PRESS ENTER OR CLICK TO PLAY', 512, 530, 15, '#fff', 'center', true); return; }
  // --- update ---
  if (G.mode === 'drive') {
    if (k['w'] || k['arrowup']) G.speed = Math.min(168, G.speed + 60 * dt);
    else if (k['s'] || k['arrowdown']) G.speed = Math.max(0, G.speed - 90 * dt);
    else G.speed = Math.max(0, G.speed - 12 * dt);
    if (k['a'] || k['arrowleft']) G.px = Math.max(300, G.px - 260 * dt);
    if (k['d'] || k['arrowright']) G.px = Math.min(730, G.px + 260 * dt);
    G.dist += G.speed * dt / 1000;
    if (G.speed > 110 && R() < dt * 0.25) G.stars = Math.min(5, G.stars + 0.02);
    if (G.dist > 0.8 && G.stage === 3) { G.stage = 4; G.msg = 'Final stage: reach the Pier 9 garage!'; G.msgT = 220; }
    if (G.dist > 1.6) { G.mode = 'done'; G.cash += 10000; }
  } else if (G.mode === 'foot') {
    const sp = 130 * dt;
    if (k['w'] || k['arrowup']) G.fy = Math.max(300, G.fy - sp);
    if (k['s'] || k['arrowdown']) G.fy = Math.min(520, G.fy + sp);
    if (k['a'] || k['arrowleft']) G.fx = Math.max(120, G.fx - sp);
    if (k['d'] || k['arrowright']) G.fx = Math.min(900, G.fx + sp);
    G.speed = 0;
  }
  G.traffic.forEach((c, i) => {
    c.y += (30 + G.speed * 0.35 - c.v) * dt * (G.mode === 'drive' ? 1 : 0.3);
    if (c.y > 600) { c.y = 250; c.x = 360 + ((i * 137 + G.t * 40) % 320); }
    if (c.y < 230) c.y = 590;
    if (G.mode === 'drive' && Math.abs(c.y - 520) < 42 && Math.abs(c.x - G.px) < 95) {
      G.cond = Math.max(12, G.cond - 14 * dt); G.stars = Math.min(5, G.stars + dt * 0.3);
    }
  });
  if (G.msgT > 0) G.msgT -= dt * 60;
  // --- render: live boulevard ---
  R = mulberry(99);
  boulevardSky('golden');
  const horizon = 218;
  rect(0, horizon, W, H - horizon, '#7c828e');
  vgrad(0, horizon - 30, 300, 130, [[0, '#2e7fc4'], [1, '#63c2e8']]);
  poly([[0, horizon + 58], [330, horizon + 30], [300, H], [0, H]], '#f0d79a');
  drawTower(742, horizon + 26, 74, 168, '#5a6f9e', 0.55, 'AZURE PEARL');
  drawTower(892, horizon + 34, 80, 196, '#66779f', 0.6, 'CASINO ROW');
  drawTower(676, horizon + 22, 60, 118, '#4c5f8a', 0.45, 'HOTEL SOLANO');
  roadPerspective(horizon, 268, 986, 452, 588, '#404654');
  poly([[452, horizon], [268, H], [150, H], [330, horizon]], '#9aa0ad');
  poly([[588, horizon], [986, H], [1024, H], [700, horizon]], '#9aa0ad');
  drawPalm(238, 430, 165, -1); drawPalm(806, 420, 150, 1);
  rrect(596, 236, 118, 22, 4, 'rgba(8,20,40,0.9)');
  txt('THE STRAND →', 655, 251, 12, '#7df0ff', 'center', true);
  if (G.stage >= 4) { // Pier 9 garage marker ahead
    rrect(478, 238, 92, 30, 5, 'rgba(10,40,20,0.92)');
    txt('PIER 9 ⛽', 524, 258, 13, '#8dff9a', 'center', true);
  }
  drawHeli(648 + Math.sin(G.t * 0.6) * 26, 118, 110, G.mode === 'drive' ? [G.px, 330] : null);
  G.traffic.forEach(c => drawCar(c.x, c.y, 60 + (c.y - 240) * 0.22, c.c, { plate: 'MB·' + Math.floor(c.v * 10) }));
  G.police.forEach((p, i) => {
    const txp = G.px + (i - 1) * 235, typ = 486 + Math.sin(G.t * 2 + p.sway) * 5;
    drawCar(txp, typ, 205, '#e8ecf2', { police: true, roof: '#31456b', flash: true, plate: 'MBPD·0' + (3 + i * 2) });
  });
  if (G.mode === 'drive') {
    drawCar(G.px, 548, 330, '#d8232f', { spoiler: true, roof: '#8f1420', plate: 'VNT·GT 1' });
  } else {
    drawCar(G.px, 548, 300, '#d8232f', { spoiler: true, roof: '#8f1420', plate: 'VNT·GT 1' });
    drawCar(742, 470, 180, '#2e9ec4', { roof: '#1c6e8c', plate: 'AZR·CAB 2' });
    if (Math.abs(G.fx - 742) < 190 && Math.abs(G.fy - 470) < 90) {
      rrect(G.fx - 118, G.fy - 108, 236, 30, 7, 'rgba(8,12,26,0.92)');
      txt('[ E ]  STEAL — Azure Cabriolet', G.fx, G.fy - 88, 13, '#8dff9a', 'center', true);
    }
    drawPerson(G.fx, G.fy, 92, '#24344f', '#1c2739', '#c98d64', (k['w'] || k['a'] || k['s'] || k['d']) ? 'run' : 'walk');
  }
  // HUD (live values)
  const hh = String(18 + Math.floor(G.t / 120)).padStart(2, '0'), mm = String(Math.floor(G.t / 2) % 60).padStart(2, '0');
  missionCard(10, 10, 'PEARL HEIST: GETAWAY', 'STAGE ' + G.stage + '/4',
    G.mode === 'foot' ? 'On foot — steal a car or return to the Vantara' : 'Lose the MBPD tail on The Strand',
    G.stage >= 4 ? 'Pier 9 garage — ' + Math.max(0, 1.6 - G.dist).toFixed(1) + ' km' : 'Pier 9 garage — ' + (0.8 - Math.min(0.8, G.dist)).toFixed(1) + ' km to final stage');
  dispatch(752, 10, 'MBPD DISPATCH — PURSUIT', [
    ['Unit 3 · R. Calloway', G.speed > 90 ? 'RAMMING' : 'PURSUING', Math.max(8, Math.round(30 - G.speed * 0.12)) + ' m'],
    ['AIR-1 · S. Okafor', 'SPOTLIGHT', '60 m'],
    ['Unit 7 · D. Ferreira', 'FLANKING', '18 m'],
    ['Unit 5 · A. Petrov', 'PIT MANEUVER', '52 m'],
  ]);
  crewStack(10, 118, null);
  topBar(G.cash.toLocaleString('en-US'), hh + ':' + mm, Math.floor(G.stars), G.stars >= 4 ? 'IN SIGHT' : 'HUNTED');
  weaponChips(10, 520, [['PISTOL', '24 / 96'], ['SMG', '61 / 240'], ['STICKY', '× 3']]);
  vehicleCard(806, 500, 'VANTARA GT', Math.round(G.cond), Math.round(G.speed));
  radioLine(10, 486, 'RADIO SOL 98.1 — “Neon Palms” by Coastline Club');
  minimap(934, 288, 56, [[-0.7, 0.6], [-0.3, 0.3], [0.05, 0.05], [0.55, -0.3]],
    [[-0.25, 0.18, 4], [0.28, 0.12, 4]], 'THE STRAND');
  if (G.msgT > 0 && G.msg) { panel(300, 470, 424, 34, 0.85); txt(G.msg, 512, 492, 13, '#8dff9a', 'center', true); }
  if (G.mode === 'done') {
    panel(312, 220, 400, 130, 0.92);
    txt('GETAWAY COMPLETE!', 512, 262, 24, '#8dff9a', 'center', true);
    txt('The Pearl take is fenced at Pier 9. +$10,000', 512, 292, 13, '#fff', 'center');
    txt('Click to free-roam Marisol Bay again', 512, 322, 12, '#bcd6f5', 'center');
  }
}

/* ---------- boot ---------- */
if (SHOT === 'chase') sceneChase();
else if (SHOT === 'foot') sceneFoot();
else if (SHOT === 'map') sceneMap();
else if (SHOT === 'title') sceneTitle();
else {
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    playFrame(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
